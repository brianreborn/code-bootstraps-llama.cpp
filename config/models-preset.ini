; code-bootstraps-llama.cpp: router presets for llama-server (--models-preset)
; Format: tools/server/README.md "Model presets" (pinned llama.cpp 0.7.0, b11669).
; Keys are llama-server flags without the leading dashes.
;
; Sampling follows each model's card (familia #51; the manifest's card_defaults, from the
; model's Hugging Face repo). A value that differs from the card carries a comment
; "; override KEY: reason", and "; card-set: LABEL" picks another of the card's sets;
; scripts/check-card-defaults.py fails on any difference without a reason.
;
; The sections [general], [coder] and [decision] are the model names the router serves.
; scripts/serve.sh pins each one to ONE file ("model = <path>") in the preset it really uses,
; .cache/models-preset.effective.ini (with the PROFILE overlay and the language slot): the
; first file of that role in config/models-manifest.json found in models/<role>/, sha256-checked.
; Any other .gguf (mmproj, mtp, a stray download) is never served. To serve another file
; for a role, put "model = path/to/file.gguf" in its section here (relative paths are
; relative to the repository); manifest files are sha256-checked, others get a warning.
; Restart serve.sh after changing models.
version = 1

[*]
; Model instances spawned by the router listen on 127.0.0.1 without the API key,
; so they must not carry the real tools: scripts/serve.sh gives tools and MCP to
; the router via LLAMA_ARG_* env vars, and these two keys override them in every
; instance (get_info is read-only; an empty --tools value is rejected upstream).
tools              = get_info
mcp-servers-config = config/mcp-servers.empty.json

; shared by every model instance (4-8 GB devices). Threads, GPU layers and repack
; are set by serve.sh / serve.ps1 on the command line. load-mode here is the
; default unless LOAD_MODE is set, which then applies to general, coder and
; decision. On Android, serve.sh uses mmap unless LOAD_MODE is set.
; Concurrency: several slots share ONE unified KV pool (kv-unified), each slot is
; capped by kv-unified-per-slot, continuous batching interleaves their tokens.
; llama-batched-bench (Qwen3.5-2B, 8 threads, this repo's README): 4 concurrent
; requests = 55.9 tok/s aggregate vs 18.1 tok/s for one.
; cache-ram (MiB): serve.sh / serve.ps1 overwrite it per profile (lowram 768, moderate 1024,
; default 2048, at most a quarter of free RAM); CACHE_RAM or --cache-ram wins. One coder prompt
; state is about 490 MiB at 25k tokens (issue #16).
cont-batching = true
; override ctx-size: sized for 4-8 GB devices (2 slots x 8k in one 16k unified pool), not the models' 32k-262k maximum
ctx-size      = 131072
cache-ram     = 1024
stop-timeout  = 60

[general]
; generic chat model: 2 slots x 8k in a 16k pool (inherits [*])
; locked in RAM where mlock is allowed. Android cannot hold it (see serve.sh).
load-mode = mmap+mlock
; LFM2.5 card, "Generation parameters": temperature 0.1, top_k 50, repetition_penalty 1.05
; (the card states no top-p, so none is set: the old top-p 0.9 had no source)
; chat template: serve.sh adds "chat-template-file" for a manifest model whose GGUF template differs
; from its repo's (LFM2.5: the GGUF's drops tool-call history; manifest chat_template_*), fetched by
; fetch-models.sh at the pinned revision and sha256-checked.
temp           = 0.1
top-k          = 50
repeat-penalty = 1.05
model = /home/green/.local/share/gguf/hf-meta/TokenTinkerer--Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-TTQ-GGUF/ecddbd888f35d017429154bea68dfcdce5b4ee90/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-TTQ-3.93bpw-Q3_K_M.gguf

[coder]
; coding agent model, tool calls parsed by the model's chat template parser
load-mode = mmap+mlock
ctx-size  = 131072
; card-set: Thinking mode for VL or precise coding
; override card-set: Qwen3.5's precise-coding set (0.6/0.95/20/0), used with reasoning off; the card's default (non-thinking text: temp 1.0, top-p 1.0, presence-penalty 2.0) made no clear difference over 5 agent runs (README "Repeat guard"), so tool calling stays on the tested values
temp      = 0.6
top-p     = 0.95
top-k     = 20
min-p     = 0.0
reasoning = off

[decision]
; decision model, served by POST /v1/systemone
; laya/clef evaluate the whole prompt in one batch: it must fit in ubatch-size
; 2 slots, each prompt up to 4k tokens in an 8k pool
ctx-size    = 32768
batch-size  = 16384
ubatch-size = 32768

[language]
; Opt-in interpreter / localizer (scripts/fetch-models.sh --language: HY-MT1.5-1.8B,
; license NOT valid in the EU, UK and South Korea; extra terms above 100M MAU).
; Registered by scripts/serve.sh only with LANGUAGE_MODE=interpret and a non-English
; LOCALE; serve.sh adds "model = models-optional/language/<file>.gguf" here.
; Greedy decoding: translations must be faithful and code spans byte-exact.
; The HY-MT card recommends top_k 20, top_p 0.6, repetition_penalty 1.05, temperature 0.7.
; override temp: greedy decoding so translations are deterministic and code spans byte-exact (README "Languages" round trip measured greedy)
; override top-k: greedy decoding (top-k 1), see temp
; override top-p: irrelevant with greedy decoding (top-k 1)
; override repeat-penalty: a repeat penalty would alter repeated code tokens in byte-exact spans; the measured round trip used 1.0
; override ctx-size: one translation request at a time; 8k covers a turn and its context on 4-8 GB devices
parallel    = 1
ctx-size    = 16384
temp        = 0.0
top-k       = 1
reasoning   = off

; --- locale swap (opt-in) -------------------------------------------------------
; [locale.<lang>.<role>] sections are never served as models. When the locale is
; <lang> and LANGUAGE_MODE=swap, scripts/serve.sh merges the keys of
; [locale.<lang>.general] into [general] (and [locale.<lang>.coder] into [coder]
; with SWAP_CODER=1), so the language-native model takes that role's place: no extra
; model in memory, no translation round trip. Install with fetch-models.sh --locale <lang>.

[locale.ja.general]
; Qwen3.5-0.8B-Japanese-SFT-v2 (Apache-2.0), sampling as recommended on its model card
model            = models-optional/locale/ja/Qwen3.5-0.8B-Japanese-SFT-v2-Q4_K_M.gguf
temp             = 1.0
top-k            = 20
top-p            = 1.0
presence-penalty = 2.0
repeat-penalty   = 1.1
reasoning        = off

[locale.ja.coder]
; same model as the coder (SWAP_CODER=1 only). NOT RECOMMENDED: in the test (README
; "Languages") it made 0 tool calls in 12 Japanese agent runs and malformed ones in English.
; override temp: keeps the coder's precise-coding sampling; the card's 推奨の生成設定 is for conversation
; override top-p: inherited from [coder] (precise-coding set), see temp
; override presence-penalty: inherited from [coder] (0), see temp
; override ctx-size: inherited from [coder] (4 sessions x 16k in a 32k pool)
model            = models-optional/locale/ja/Qwen3.5-0.8B-Japanese-SFT-v2-Q4_K_M.gguf
temp             = 0.6
top-k            = 20
repeat-penalty   = 1.1
reasoning        = off

[embed]
; Optional embedding-only route. Uses a separate process on EMBED_PORT (--embeddings).
; No slot persistence. Handled completely independently from the generative router.
; serve.sh passes these keys to that process; pooling is REQUIRED (familia #51).
; embeddinggemma-2: "Mean Pooling" (unsloth/embeddinggemma-2-GGUF README.md L84), context 8192
; (google/embeddinggemma-2 README.md L45; the GGUF header says 262144). An input that cannot be
; split must fit in one ubatch, so ubatch = batch = ctx (llama.cpp server-context.cpp).
; Clients prefix inputs with the card's task prompts (e.g. "task: search result | query: ").

ctx-size    = 262144
parallel    = 1
pooling     = mean
