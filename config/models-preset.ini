; code-bootstraps-llama.cpp: router presets for llama-server (--models-preset)
; Format: tools/server/README.md "Model presets" (pinned llama.cpp 436f6f89e).
; Keys are llama-server flags without the leading dashes.
;
; Model names come from --models-dir models/ : every subdirectory is one model
; named after the directory, so the three roles are always called
; "general", "coder" and "decision" no matter which GGUF sits inside.
; To swap a model, replace the .gguf in models/<role>/ (one per directory).
;
; DRAFT: model choices are not final, Brian picks them.
version = 1

[*]
; Model instances spawned by the router listen on 127.0.0.1 without the API key,
; so they must not carry the real tools: scripts/serve.sh gives tools and MCP to
; the router via LLAMA_ARG_* env vars, and these two keys override them in every
; instance (get_info is read-only; an empty --tools value is rejected upstream).
tools              = get_info
mcp-servers-config = config/mcp-servers.empty.json

; shared by every model instance (4-8 GB devices). Threads, GPU layers, repack and
; load mode are detected and set by scripts/serve.sh on the command line.
; Concurrency: several slots share ONE unified KV pool (kv-unified), each slot is
; capped by kv-unified-per-slot, continuous batching interleaves their tokens.
; llama-batched-bench (Qwen3.5-2B, 8 threads, this repo's README): 4 concurrent
; requests = 55.9 tok/s aggregate vs 18.1 tok/s for one.
cont-batching = true
kv-unified    = true
parallel      = 2
ctx-size      = 16384
kv-unified-per-slot = 8192
cache-ram     = 256
stop-timeout  = 10

[general]
; generic chat model: 2 slots x 8k in a 16k pool (inherits [*])
temp     = 0.7
top-p    = 0.9

[coder]
; coding agent model, tool calls parsed by the model's chat template parser
; 4 agent sessions at once, each up to 16k tokens, sharing a 32k pool
parallel  = 4
ctx-size  = 32768
kv-unified-per-slot = 16384
temp      = 0.6
top-p     = 0.95
top-k     = 20
min-p     = 0.0
reasoning = off

[decision]
; decision model, served by POST /v1/systemone
; laya/clef evaluate the whole prompt in one batch: it must fit in ubatch-size
; 2 slots, each prompt up to 4k tokens in an 8k pool
ctx-size    = 8192
kv-unified-per-slot = 4096
batch-size  = 4096
ubatch-size = 4096
