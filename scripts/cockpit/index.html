<!doctype html><html lang="en"><meta charset="utf-8"><title>FAMILIA // MECHA COCKPIT</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#03050a;--fg:#c8f4ff;--cy:#28e7ff;--mg:#ff2e88;--am:#ffb627;--dim:#2d5878;--pan:#06101ccc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:12px/1.4 ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
 background:radial-gradient(ellipse at 50% 120%,#1a0f2e 0,transparent 55%),radial-gradient(ellipse at 50% -30%,#0c2a4a,transparent 60%),
 linear-gradient(90deg,#0a1a2a22 1px,transparent 1px) 0 0/40px 40px,linear-gradient(#0a1a2a22 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
 background:repeating-linear-gradient(transparent 0 2px,#00000022 2px 3px);mix-blend-mode:multiply}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.6em 1.4em;align-items:center;padding:.5em 1.2em;
 background:linear-gradient(90deg,#14001acc,#001a2acc 40%,#001a2acc 60%,#14001acc);border-bottom:2px solid var(--mg);
 box-shadow:0 0 18px #ff2e8855;clip-path:polygon(0 0,100% 0,100% 70%,97% 100%,3% 100%,0 70%)}
.logo{font-weight:700;letter-spacing:.35em;color:var(--mg);text-shadow:0 0 8px var(--mg)}
.logo i{color:var(--cy);font-style:normal;text-shadow:0 0 8px var(--cy)}
.st{display:flex;gap:1.2em;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.st span b{color:var(--am)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:.4em;vertical-align:middle}
.dot.on{background:#3dff9a;box-shadow:0 0 8px #3dff9a;animation:p 1.6s infinite}.dot.bad{background:var(--mg);box-shadow:0 0 8px var(--mg)}
@keyframes p{50%{opacity:.35}}
#sw{display:flex;flex-wrap:wrap;gap:.35em;width:100%}
#sw label{cursor:pointer;padding:.15em .7em;border:1px solid var(--dim);color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.1em;
 clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);user-select:none}
#sw label.on{border-color:var(--cy);color:var(--bg);background:var(--cy);box-shadow:0 0 10px #28e7ff88}
#sw label.syn.on{background:var(--am);border-color:var(--am)}
#sw input{display:none}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:14px;padding:14px}
section{position:relative;padding:3px;background:linear-gradient(135deg,var(--cy),#0b3550 30%,#0b3550 70%,var(--mg));
 clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));filter:drop-shadow(0 0 6px #28e7ff44)}
section>div{background:var(--pan);clip-path:inherit;height:100%}
section h2{display:flex;justify-content:space-between;gap:1em;margin:0;padding:.35em .9em .35em 1.2em;font-size:11px;letter-spacing:.25em;text-transform:uppercase;
 color:var(--cy);background:linear-gradient(90deg,#0e2f4d,#071624);border-bottom:1px solid #28e7ff55}
section h2:before{content:"◆ ";color:var(--mg)}
section h2 small{color:var(--dim);letter-spacing:0;text-transform:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:1em;padding:.15em 1.2em;font-size:10px;color:var(--dim);letter-spacing:.1em;border-bottom:1px dashed #2d587855}
.meta b{color:var(--am)}
pre{margin:0;height:320px;overflow:auto;padding:.4em .9em;white-space:pre;scrollbar-color:var(--dim) transparent}
.l{overflow:hidden;text-overflow:ellipsis}.l:hover{background:#28e7ff14}
.e{color:#ff6b8f;text-shadow:0 0 4px #ff2e8877}.w{color:var(--am)}.n{animation:f .8s}
@keyframes f{from{background:#28e7ff33}}
section.alert{filter:drop-shadow(0 0 10px #ff2e88aa)}
.corner{position:absolute;width:14px;height:14px;border:2px solid var(--am);pointer-events:none}
.c1{top:6px;left:6px;border-right:0;border-bottom:0}.c2{bottom:6px;right:6px;border-left:0;border-top:0}
canvas{width:100%;height:130px;display:block}
footer{text-align:center;color:var(--dim);font-size:10px;letter-spacing:.3em;padding:.5em}
</style>
<header><span class="logo">FAMILIA <i>//</i> COCKPIT</span>
<span class="st"><span><i id="dot" class="dot"></i><span id="st">link offline</span></span><span>LINES <b id="tl">0</b></span><span>ERR <b id="te">0</b></span><span>WARN <b id="tw">0</b></span><span id="rs" title="">THINK <b id="rsg">?</b>/<b id="rsc">?</b></span><span id="clk"></span></span>
<div id="sw"></div></header>
<main id="m"></main>
<footer>ALL LOG DISPLAYS ON BY DEFAULT · TAP A SWITCH TO POWER A SCREEN DOWN · HEAT MAP IS SYNTHETIC (OPT-IN)</footer>
<script>
const MAX=2000,CUT=400;let key=sessionStorage.k||"";const rate={},$=i=>document.getElementById(i);let T={l:0,e:0,w:0};
setInterval(()=>{$("clk").textContent=new Date().toLocaleTimeString()},1000);
function sw(name,on,syn){const c=document.createElement("label");c.className=(syn?"syn ":"")+(on?"on":"");c.innerHTML=`<input type=checkbox ${on?"checked":""}>${name}`;
  $("sw").append(c);c.firstChild.addEventListener("change",e=>c.classList.toggle("on",e.target.checked));return c.firstChild}
function panel(title,sub){const s=document.createElement("section");s.innerHTML=`<div><h2><span></span><small></small></h2><div class="meta"></div></div><i class="corner c1"></i><i class="corner c2"></i>`;
  s.querySelector("h2 span").textContent=title;s.querySelector("small").textContent=sub;return s}
async function start(){
  if(!key){key=prompt("API key (same as the server's; see the instance api-keys file)")||"";sessionStorage.k=key}
  const r=await fetch("/logs",{headers:{Authorization:"Bearer "+key}});
  if(r.status==401){sessionStorage.k="";key="";$("st").textContent="API key rejected — reload";$("dot").className="dot bad";return}
  fetch("/reasoning",{headers:{Authorization:"Bearer "+key}}).then(x=>x.json()).then(R=>{$("rsg").textContent="GEN "+R.general;$("rsc").textContent="CODER "+R.coder;
    $("rs").title="reasoning per role (from "+R.source+"); display only. Change: "+R.set+", then restart"}).catch(()=>{});
  const L=await r.json();$("st").textContent=Object.keys(L).length+" log screens";$("dot").className="dot on";const m=$("m");
  for(const [n,p] of Object.entries(L)){
    const s=panel(n,p);m.append(s);const pre=document.createElement("pre");s.firstChild.append(pre);const meta=s.querySelector(".meta");
    let cnt=0,err=0,last="—";rate[n]=0;const upd=()=>{meta.innerHTML=`<span>LINES <b>${cnt}</b></span><span>ERR <b>${err}</b></span><span>LAST <b>${last}</b></span>`};upd();
    const box=sw(n,true);let es;
    const on=()=>{es=new EventSource("/stream?log="+encodeURIComponent(n)+"&key="+encodeURIComponent(key));
      es.onerror=()=>{$("dot").className="dot bad"};es.onopen=()=>{$("dot").className="dot on"};
      es.onmessage=e=>{let t=JSON.parse(e.data);rate[n]++;cnt++;T.l++;const E=/error|fail|unauthori/i.test(t),W=!E&&/warn/i.test(t);
        if(E){err++;T.e++;s.classList.add("alert");setTimeout(()=>s.classList.remove("alert"),1500)}if(W)T.w++;
        const d=document.createElement("div");d.className="l n"+(E?" e":W?" w":"");d.textContent=t.length>CUT?t.slice(0,CUT)+" …":t;d.title=t.length>CUT?t:"";
        const stick=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-4;pre.append(d);while(pre.childNodes.length>MAX)pre.firstChild.remove();
        if(stick)pre.scrollTop=pre.scrollHeight;last=new Date().toLocaleTimeString();upd();$("tl").textContent=T.l;$("te").textContent=T.e;$("tw").textContent=T.w}};
    on();box.addEventListener("change",e=>{s.hidden=!e.target.checked;if(e.target.checked)on();else es.close()});
  }
  const hb=sw("heat map (synthetic)",false,true),hs=panel("heat map","lines/s per log — synthetic, not a log");hs.hidden=true;
  const cv=document.createElement("canvas");cv.width=800;cv.height=130;hs.firstChild.append(cv);m.prepend(hs);
  hb.addEventListener("change",e=>hs.hidden=!e.target.checked);
  const g=cv.getContext("2d"),names=Object.keys(L);
  setInterval(()=>{g.drawImage(cv,-4,0);const bh=cv.height/Math.max(1,names.length);
    names.forEach((n,i)=>{const v=Math.min(1,rate[n]/20);rate[n]=0;g.fillStyle=`hsl(${190+140*v},100%,${8+50*v}%)`;g.fillRect(cv.width-4,i*bh,4,bh)})},1000);
}
start();
</script></html>
